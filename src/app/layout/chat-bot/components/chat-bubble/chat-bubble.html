<div
  class="chat-bubble"
  [class.chat-bubble--user]="message().sender === 'user'"
  [class.chat-bubble--bot]="message().sender === 'bot'"
>
  @if (message().sender === 'bot') {
    <div class="chat-bubble__avatar chat-bubble__avatar--bot">
      <img src="images/chatbot.webp" [alt]="'CHATBOT.SMART_COACH' | translate" />
    </div>
  }

  <div class="chat-bubble__content">
    <p class="chat-bubble__text">{{ message().text === 'CHATBOT.DEFAULT_BOT_MESSAGE' ? 'Hello How Can I Assist You Today ?' : message().text }}</p>
  </div>

  @if (message().sender === 'user') {
    <div class="chat-bubble__avatar chat-bubble__avatar--user">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
        <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
      </svg>
    </div>
  }
</div>
