<div class="login flex w-full flex-col gap-4">
  <app-auth-heading
    [lead]="'AUTH.LOGIN_PAGE.LEAD' | translate"
    [headline]="'AUTH.LOGIN_PAGE.HEADLINE' | translate"
  />

  <form
    class="login__form flex w-full flex-col gap-4 rounded-[50px] border border-muted px-[87.5px] py-[40px]"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
  >
    <h2 class="login__title m-0 text-center font-baloo text-xl font-bold text-white">
      {{ 'AUTH.LOGIN_PAGE.TITLE' | translate }}
    </h2>

    <app-auth-input
      type="email"
      [placeholder]="'AUTH.LOGIN_PAGE.EMAIL_PLACEHOLDER' | translate"
      formControlName="email"
      autocomplete="email"
    />

    <div class="login__password flex flex-col gap-1">
      <app-auth-input
        type="password"
        [placeholder]="'AUTH.LOGIN_PAGE.PASSWORD_PLACEHOLDER' | translate"
        formControlName="password"
        autocomplete="current-password"
      />
      <app-auth-link customClass="text-end">
        <a link routerLink="/auth/forgot-password" class="font-rubik text-sm">
          {{ 'AUTH.LOGIN_PAGE.FORGOT_PASSWORD' | translate }}
        </a>
      </app-auth-link>
    </div>

    <div class="login__social flex flex-col gap-3">
      <app-auth-or-divider />
      <app-auth-social-media-icons />
    </div>

    @if (loginError(); as message) {
      <app-auth-error [message]="message" />
    }

    <div class="login__cta flex flex-col gap-2">
      <app-auth-button kind="login" type="submit" />

      <app-auth-link>
        <span text>{{ 'AUTH.LOGIN_PAGE.NO_ACCOUNT' | translate }}</span>
        <a link routerLink="/auth/register">{{ 'AUTH.LOGIN_PAGE.REGISTER_LINK' | translate }}</a>
      </app-auth-link>
    </div>
  </form>
</div>
