<div class="reset-password flex w-full flex-col gap-4">
  <app-auth-heading [headline]="'AUTH.RESET_PASSWORD_PAGE.HEADLINE' | translate" />

  <form
    class="reset-password__form flex w-full flex-col gap-4 rounded-[50px] border border-muted px-[87.5px] py-[40px]"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
  >
    <p class="reset-password__instruction m-0 text-center font-rubik text-base font-normal text-white">
      {{ 'AUTH.RESET_PASSWORD_PAGE.INSTRUCTION' | translate }}
    </p>

    <app-auth-input
      type="password"
      [placeholder]="'AUTH.RESET_PASSWORD_PAGE.PASSWORD' | translate"
      formControlName="password"
      autocomplete="new-password"
    />

    <app-auth-input
      type="password"
      [placeholder]="'AUTH.RESET_PASSWORD_PAGE.CONFIRM_PASSWORD' | translate"
      formControlName="confirmPassword"
      autocomplete="new-password"
    />

    @if (errorMessage(); as message) {
      <app-auth-error [message]="message" />
    }

    <div class="reset-password__cta mt-2 flex flex-col gap-2">
      <app-auth-button kind="done" type="submit" [disabled]="isSubmitting()" />
    </div>
  </form>
</div>
