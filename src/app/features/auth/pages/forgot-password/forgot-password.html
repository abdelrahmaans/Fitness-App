<div class="forgot-password flex w-full flex-col gap-4">
  <app-auth-heading [headline]="'AUTH.FORGOT_PASSWORD_PAGE.HEADLINE' | translate" />

  <form
    class="forgot-password__form flex w-full flex-col gap-6 rounded-[50px] border border-muted px-[87.5px] py-[40px]"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
  >
    <p class="forgot-password__label m-0 text-center font-rubik text-base font-normal text-white">
      {{ 'AUTH.FORGOT_PASSWORD_PAGE.LABEL' | translate }}
    </p>

    <app-auth-input
      type="email"
      [placeholder]="'AUTH.FORGOT_PASSWORD_PAGE.EMAIL_PLACEHOLDER' | translate"
      formControlName="email"
      autocomplete="email"
    />

    @if (errorMessage(); as message) {
      <app-auth-error [message]="message" />
    }

    <div class="forgot-password__cta flex flex-col gap-2">
      <app-auth-button kind="sentOtp" type="submit" [disabled]="isSubmitting()" />
    </div>
  </form>
</div>
