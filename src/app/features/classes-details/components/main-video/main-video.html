<div class="main-video">
  @if (isPlaying() && embedUrl()) {
    <!-- Embedded Video Player -->
    <div class="main-video__player-wrapper">
      <iframe
        class="main-video__iframe"
        [src]="embedUrl()"
        title="Exercise demonstration video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
      ></iframe>
      <button
        type="button"
        class="main-video__close-btn"
        aria-label="Close video"
        (click)="onCloseVideo()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          class="main-video__close-icon"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  } @else {
    <!-- Background Thumbnail Image -->
    <img
      class="main-video__thumbnail"
      [src]="thumbnail()"
      [alt]="title() + ' exercise demonstration'"
      loading="eager"
    />

    <!-- Dark Gradient Overlay -->
    <div class="main-video__overlay" aria-hidden="true"></div>

    <!-- Content Layer -->
    <div class="main-video__content">
      <!-- Center Section: Play Button + Exercise Title -->
      <div class="main-video__center">
        <button
          type="button"
          class="main-video__play-btn"
          aria-label="Play video"
          (click)="onPlayVideo()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="main-video__play-icon"
          >
            <path d="M8 5v14l11-7z" />
          </svg>
        </button>

        <h1 class="main-video__title">{{ title() }}</h1>
      </div>

      <!-- Bottom Section: Description + Badges -->
      <div class="main-video__bottom">
        <p class="main-video__description">{{ description() }}</p>

        <div class="main-video__badges">
          <span class="main-video__badge">{{ difficultyBadge() }}</span>
          <span class="main-video__badge main-video__badge--equipment">
            {{ equipmentBadge() }}
          </span>
          <span class="main-video__badge main-video__badge--posture">
            {{ postureBadge() }}
          </span>
        </div>
      </div>
    </div>
  }
</div>
