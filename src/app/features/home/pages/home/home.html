<section class="relative flex flex-col overflow-x-hidden bg-ink">
  <!-- Hero through the first marquee fills one screen -->
  <div class="flex h-dvh flex-col">
    <app-hero class="min-h-0 flex-1" />

    <app-marquee-banner
      class="shrink-0"
      [services]="['HIIT & CARDIO', 'CROSSFIT ZONE', 'NUTRITION CONSULTING', 'YOGA & PILATES']"
      [animationSpeed]="20"
    />
  </div>

  <app-about-us-section />

  <!-- Workouts Section -->
  <app-workouts />

  <!-- Why Us Section -->
  <app-why-us />


  <!-- Healthy Nutrition Section -->
  <main class="flex-1 flex flex-col justify-center">
    <app-healthy-nutrition />
  </main>

  <!-- Floating Preferences Widget (Language & Theme) -->
  <aside class="fixed bottom-4 left-4 sm:bottom-6 sm:left-6 z-50 pointer-events-auto">
    <app-language-switcher />
  </aside>
</section>
