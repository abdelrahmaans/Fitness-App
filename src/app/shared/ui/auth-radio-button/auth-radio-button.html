<div role="radiogroup" class="flex flex-col gap-4 items-center">
  @for (option of options(); track option.id) {
    <label
      class="flex items-center justify-between px-[16px] py-[14px] rounded-[20px] w-[19.4375rem] h-[3rem] cursor-pointer transition-all duration-200 has-[:focus-visible]:outline has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-orange-500 has-[:focus-visible]:outline-offset-2"
      [class]="
        value() === option.value
          ? 'border border-orange-500 bg-white/5 text-orange-500'
          : 'border border-white/15 bg-white/5 text-gray-300 hover:bg-white/10'
      "
    >
      <span class="font-medium text-[16px] text-weight-[700] select-none">{{ option.label }}</span>

      <!-- Radio Indicator -->
      <div
        class="w-[1.25rem] h-[1.25rem] rounded-full border-[1.5px] flex items-center justify-center transition-all duration-200 shrink-0"
        [class]="'border-gray-400'"
      >
        @if (value() === option.value) {
          <div class="w-[0.75rem] h-[0.75rem] rounded-full bg-orange-500"></div>
        }
      </div>

      <input
        type="radio"
        [value]="option.value"
        [checked]="value() === option.value"
        (change)="selectOption(option.value)"
        class="sr-only"
        [attr.name]="name()"
      />
    </label>
  }
</div>
